<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#737e44" />
      <stop offset="100%" stop-color="#4a522c" />
    </linearGradient>
  </defs>
  
  <g transform="translate(256, 256)">
    <!-- Interlocking elegant H -->
    <!-- Left loop -->
    <path d="M -50 -100 C -100 -100 -100 -20 -100 0 C -100 20 -100 100 -50 100 C 0 100 0 20 0 0 C 0 -20 0 -100 -50 -100 Z" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linecap="round" />
    <!-- Right loop -->
    <path d="M 50 -100 C 100 -100 100 -20 100 0 C 100 20 100 100 50 100 C 0 100 0 20 0 0 C 0 -20 0 -100 50 -100 Z" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linecap="round" />
    <!-- Center cross -->
    <path d="M -50 0 L 50 0" fill="none" stroke="url(#gold)" stroke-width="40" />
    <!-- Small star/sparkle top right -->
    <path d="M 110 -120 Q 110 -150 140 -150 Q 110 -150 110 -180 Q 110 -150 80 -150 Q 110 -150 110 -120 Z" fill="url(#gold)" />
  </g>
</svg>
